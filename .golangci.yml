version: "2"

linters:
  # errcheck, govet, ineffassign, staticcheck and unused.
  default: standard
  enable:
    - depguard # enforces the architecture: see the lattice-sdk rule below
    - errorlint # errors compared or type-asserted without errors.Is and errors.As
    - misspell
    - nolintlint # //nolint directives must name a linter and say why
    - unconvert
  settings:
    depguard:
      rules:
        # The core (parsing, framing, mapping, state) stays free of the SDK, so it can be tested and fuzzed alone and
        # survives SDK upgrades. Only Entity Preflight, which asks the SDK for its enum values and field names, and the
        # publish adapter may import it.
        lattice-sdk:
          files:
            - "$all"
            - "!**/preflight/*.go"
            - "!**/internal/publish/latticesdk/*.go"
          deny:
            - pkg: github.com/anduril/lattice-sdk-go
              desc: only preflight and internal/publish/latticesdk may import the Lattice SDK
  exclusions:
    presets:
      # The conventional exceptions: unchecked fmt.Fprint* to stdout/stderr, Close and Flush.
      - std-error-handling

formatters:
  enable:
    - gofmt
    - goimports
